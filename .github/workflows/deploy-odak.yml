name: Deploy Odak (GitHub Pages)

# Builds the Flutter web app in apps/odak and publishes it to GitHub Pages
# (free hosting) at https://omeryasironal.github.io/portfolio/.
# Runs on pushes to master that touch the app, or manually.
on:
  push:
    branches: [master]
    paths: ['apps/odak/**', '.github/workflows/deploy-odak.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/odak
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # --no-web-resources-cdn keeps CanvasKit self-hosted so the PWA works
      # offline and makes no third-party CDN requests.
      - name: Build web
        run: >-
          flutter build web --release --no-web-resources-cdn
          --base-href /portfolio/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/odak/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
